name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Створюємо файл ключа з вашого секрету SIGNING_KEY_BASE64
      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > maf-release.jks
          # Копіюємо ключ у всі можливі папки для надійності
          cp maf-release.jks app/maf-release.jks || true

      # ВИПРАВЛЕННЯ: Знаходимо файл gradlew і даємо йому права на запуск
      - name: Grant execute permission for gradlew
        run: find . -name "gradlew" -exec chmod +x {} +

      # ВИПРАВЛЕННЯ: Запуск збірки з автоматичним пошуком шляху до Gradle
      - name: Build Release APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          $GRADLEW_PATH assembleRelease --stacktrace
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # Пошук готового APK та підготовка до завантаження
      - name: Prepare APK for upload
        run: |
          APK_PATH=$(find . -name "*-release.apk" | head -n 1)
          cp "$APK_PATH" maf.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maf-app-release
          path: maf.apk
