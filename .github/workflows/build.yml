name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Створюємо файл ключа з вашого секрету
      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > app/maf-release.jks

      # ВИПРАВЛЕННЯ ПОМИЛКИ: Знаходимо і даємо права на gradlew, де б він не був
      - name: Grant execute permission for gradlew
        run: |
          find . -name "gradlew" -exec chmod +x {} +

      # Запуск збірки через обгортку Gradle
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # Пошук готового APK (щоб шлях завжди був правильним)
      - name: Prepare APK for upload
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" maf.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maf-app-release
          path: maf.apk
