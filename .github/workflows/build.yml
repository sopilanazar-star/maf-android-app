name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --info

      # ПЕРЕЙМЕНУВАННЯ APK
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/maf.apk

      # ЗАВАНТАЖЕННЯ ЯК АРТЕФАКТ (буде доступно в Actions)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maf-app-v2.1
          path: app/build/outputs/apk/debug/maf.apk

      # АВТОМАТИЧНЕ СТВОРЕННЯ РЕЛІЗУ (опціонально, але дуже зручно)
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: Release v2.1 (Build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/maf.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
