name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Створюємо файл ключа з вашого секрету SIGNING_KEY_BASE64
      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > maf-release.jks
          # Про всяк випадок копіюємо в корінь та в папку app
          cp maf-release.jks app/maf-release.jks || true

      # КРОК ПЕРЕМОГИ: Генеруємо чистий Gradle Wrapper та запускаємо збірку
      - name: Build Release APK
        run: |
          # 1. Самі створюємо всі файли (gradlew, jar), щоб не було помилок маніфесту
          gradle wrapper --gradle-version 8.6
          
          # 2. Даємо права на запуск створеного файлу
          chmod +x gradlew
          
          # 3. Запускаємо збірку Release APK
          ./gradlew assembleRelease --stacktrace
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # Пошук готового APK та підготовка його до видачі
      - name: Prepare APK for upload
        run: |
          # Шукаємо файл у папці build і копіюємо його в корінь як maf.apk
          APK_PATH=$(find . -name "*-release.apk" | head -n 1)
          cp "$APK_PATH" maf.apk

      # Завантаження файлу на GitHub, щоб ви могли його скачати
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maf-app-release
          path: maf.apk
