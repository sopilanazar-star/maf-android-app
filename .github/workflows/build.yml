name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Створюємо файл ключа з вашого секрету SIGNING_KEY_BASE64
      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > maf-release.jks
          cp maf-release.jks app/maf-release.jks || true

      # ВИПРАВЛЕННЯ: Автоматично качаємо відсутній двигун Gradle і запускаємо збірку
      - name: Build Release APK
        run: |
          # 1. Створюємо папку та качаємо jar-файл, якого не вистачає
          mkdir -p gradle/wrapper
          curl -L https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          
          # 2. Знаходимо файл gradlew, даємо права і запускаємо
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          chmod +x $GRADLEW_PATH
          $GRADLEW_PATH assembleRelease --stacktrace
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # Пошук готового APK та підготовка до завантаження
      - name: Prepare APK for upload
        run: |
          APK_PATH=$(find . -name "*-release.apk" | head -n 1)
          cp "$APK_PATH" maf.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maf-app-release
          path: maf.apk
