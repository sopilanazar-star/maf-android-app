name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Додаємо дозволи для запису у репозиторій
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > maf-release.jks
          cp maf-release.jks app/maf-release.jks || true

      - name: Build Release APK
        run: |
                    chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Prepare APK for upload
        run: |
          APK_PATH=$(find . -name "*-release.apk" | head -n 1)
          cp "$APK_PATH" maf.apk

      # ЦЕЙ КРОК АВТОМАТИЧНО ОНОВЛЮЄ ФАЙЛ У ВАШОМУ РЕПОЗИТОРІЇ
      - name: Commit and Push APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add maf.apk
          git commit -m "Автоматичне оновлення maf.apk для системи оновлень" || echo "Змін немає"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maf-app-release
          path: maf.apk
